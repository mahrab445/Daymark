name: Build Daymark release

on:
  push:
    branches: [main]
    paths:
      - 'Daymark.png'
      - 'release/android/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:
    inputs:
      format:
        description: Which package should be built?
        required: true
        type: choice
        options:
          - apk
          - exe
          - both
        default: apk

permissions:
  contents: read

jobs:
  apk:
    if: ${{ inputs.format == 'apk' || inputs.format == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon -p release/android assembleDebug
      - name: Copy APK into release folder
        run: cp release/android/app/build/outputs/apk/debug/app-debug.apk release/Daymark.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Daymark-Android-APK
          path: release/Daymark.apk
          if-no-files-found: error
          retention-days: 14

  exe:
    if: ${{ inputs.format == 'exe' || inputs.format == 'both' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build Windows EXE
        shell: pwsh
        run: ./release/build-exe.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Daymark-Windows-EXE
          path: release/Daymark.exe
          if-no-files-found: error
          retention-days: 14
